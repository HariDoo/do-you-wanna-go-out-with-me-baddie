<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Date?</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Poppins", 'Nunito', sans-serif;
      }

      body {
        min-height: 100vh;
        height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(255,255,255,0.75), transparent 30%),
          radial-gradient(circle at bottom right, rgba(255,184,214,0.55), transparent 30%),
          linear-gradient(135deg, #ffeaf1 0%, #f9d7e8 35%, #f7c7d9 100%);
        display: flex;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
        overflow: hidden;
      }

      img {
        pointer-events: none;
      }

      .card {
        display: flex;
        justify-content: center;
        align-items: center;
        max-height: 66%;
        max-width: 100%;
        aspect-ratio: 1.6;
        position: absolute;
        margin: auto;
        left: 0;
        right: 30px;
        top: 0;
        bottom: 0;
        -webkit-perspective: 1200px;
        perspective: 1200px;
        transition: 1s;
        z-index: 1;
      }

      .card:hover {
        transform: rotate(-5deg);
      }

      .card:hover .outside {
        transform: rotateY(-130deg);
      }

      .outside,
      .inside {
        height: 100%;
        width: 50%;
        position: absolute;
        left: 50.1%;
      }

      .inside {
        background: linear-gradient(to right, #e7e7e7, #ffffff 30%);
        padding: 0 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
        left: 50%;
      }

      .outside {
        -webkit-transform-style: preserve-3d;
        transform-style: preserve-3d;
        z-index: 1;
        transform-origin: left;
        transition: 2s;
        cursor: pointer;
      }

      .front,
      .back {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100%;
        width: 100%;
        position: absolute;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: rotateX(0deg);
      }

      .front {
        background-color: #dcc5c5;
      }

      .back {
        transform: rotateY(180deg);
        background: linear-gradient(to left, #e7e7e7, #ffffff 30%);
        position: absolute !important;
        overflow: hidden !important;
      }

      .outside p {
        font-size: 23px;
        text-transform: uppercase;
        margin-top: 30px;
        text-align: center;
        letter-spacing: 6px;
        color: #000046;
      }

      .inside h1 {
        font-size: 120px;
        line-height: 120px;
      }

      .main-sticker {
        position: absolute;
        display: flex;
        justify-content: center;
        margin-bottom: 20%;
        margin-top: -10px;
        margin-left: 45px;
        height: 72%;
        width: 72%;
        background-color: transparent;
      }

      .Text {
        position: absolute;
        display: flex;
        font-size: large;
        margin-top: -95%;
        font-style: italic;
        color: #7b180d;
        font-family: "cursive", "Lucida handwriting", sans-serif;
      }

      .hiee {
        font-size: calc(2vw + 3px);
        text-align: center;
        margin-top: 15%;
        color: #781a0c;
        font-style: italic;
        font-family: "cursive", "Lucida handwriting", sans-serif;
      }

      .front-sticker {
        display: flex;
        justify-content: center;
        height: 70%;
        width: 70%;
        background-color: transparent;
      }

      .back-sticker {
        display: flex;
        justify-content: center;
        margin-top: 15%;
        height: 74%;
        width: 74%;
        background-color: transparent;
      }

      .buttons {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        margin-top: 115%;
        margin-left: 20px;
      }

      #noButton {
        position: absolute;
        margin-left: 150px;
      }

      #yesButton {
        position: absolute;
        margin-right: 150px;
      }

      .btn {
        background-color: #ffb6c1;
        color: white;
        padding: 12px 30px;
        text-align: center;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border: none;
        border-radius: 12px;
      }

      .sparkles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .sparkles span {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 0 12px rgba(255,255,255,0.9);
        animation: sparkle 3.5s ease-in-out infinite;
      }

      .sparkles span:nth-child(1) { top: 10%; left: 12%; animation-delay: 0s; }
      .sparkles span:nth-child(2) { top: 18%; left: 82%; animation-delay: 0.7s; }
      .sparkles span:nth-child(3) { top: 28%; left: 67%; animation-delay: 1.1s; }
      .sparkles span:nth-child(4) { top: 16%; left: 48%; animation-delay: 1.6s; }
      .sparkles span:nth-child(5) { top: 42%; left: 18%; animation-delay: 2s; }
      .sparkles span:nth-child(6) { top: 60%; left: 78%; animation-delay: 2.4s; }
      .sparkles span:nth-child(7) { top: 68%; left: 35%; animation-delay: 0.9s; }
      .sparkles span:nth-child(8) { top: 78%; left: 90%; animation-delay: 1.8s; }

      @keyframes sparkle {
        0%, 100% { transform: scale(0.4); opacity: 0.2; }
        50% { transform: scale(1.2); opacity: 1; }
      }

      .floating-hearts {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .floating-hearts span {
        position: absolute;
        bottom: -20%;
        font-size: clamp(15px, 2vw, 28px);
        color: rgba(255, 107, 156, 0.45);
        animation: floatHeart 12s linear infinite;
        opacity: 0.75;
      }

      .floating-hearts span:nth-child(1) { left: 8%; animation-delay: 0s; }
      .floating-hearts span:nth-child(2) { left: 18%; animation-delay: 2s; }
      .floating-hearts span:nth-child(3) { left: 30%; animation-delay: 4s; }
      .floating-hearts span:nth-child(4) { left: 42%; animation-delay: 1s; }
      .floating-hearts span:nth-child(5) { left: 56%; animation-delay: 3s; }
      .floating-hearts span:nth-child(6) { left: 68%; animation-delay: 5s; }
      .floating-hearts span:nth-child(7) { left: 78%; animation-delay: 2.5s; }
      .floating-hearts span:nth-child(8) { left: 88%; animation-delay: 4.5s; }
      .floating-hearts span:nth-child(9) { left: 52%; animation-delay: 6s; }
      .floating-hearts span:nth-child(10) { left: 72%; animation-delay: 7s; }

      @keyframes floatHeart {
        0% {
          transform: translateY(0) scale(0.8) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(-120vh) scale(1.2) rotate(18deg);
          opacity: 0;
        }
      }

      .no-message {
        position: absolute !important;
        bottom: 8px !important;
        top: auto !important;
        left: 50% !important;
        transform: translateX(-50%) translateY(8px) scale(0.92) !important;
        width: 88% !important;
        max-width: 88% !important;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 238, 245, 0.98)) !important;
        border: 1.5px solid rgba(255, 107, 156, 0.4) !important;
        padding: 6px 8px !important;
        border-radius: 10px !important;
        color: #b2224a !important;
        font-weight: 800 !important;
        font-size: clamp(0.7rem, 2.2vw, 0.88rem) !important;
        line-height: 1.25 !important;
        box-shadow: 0 4px 16px rgba(178, 41, 105, 0.18) !important;
        opacity: 0 !important;
        pointer-events: none !important;
        z-index: 20 !important;
        transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
        text-align: center !important;
      }

      .no-message.pop {
        opacity: 1 !important;
        transform: translateX(-50%) translateY(0) scale(1) !important;
      }

      #yesButton.jump {
        animation: jumpAnim 0.5s ease-in-out;
      }

      @keyframes jumpAnim {
        0%, 100% { transform: translateY(0) scale(1); }
        30% { transform: translateY(-14px) scale(1.15); }
        60% { transform: translateY(-3px) scale(1.05); }
      }

      .footer {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        background-color: #d5b55a00;
        color: black;
        text-align: center;
        padding: 10px 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="floating-hearts" aria-hidden="true">
      <span>❤</span>
      <span>♥</span>
      <span>❤</span>
      <span>♥</span>
      <span>❤</span>
      <span>♥</span>
      <span>❤</span>
      <span>♥</span>
      <span>❤</span>
      <span>♥</span>
    </div>

    <div class="sparkles" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="card">
     <div class="outside">
         <div class="front">
          <div class="hiee">
            <p1>Subbulakshmi wana go for round two ?</p1>
          </div>
          <div class="front-sticker">
            <img src="image/front-stk.webp" alt="Sticker">
          </div>
        </div>
        <div class="back">
          <div class="back-sticker">
            <img src="image/back.webp" alt="Back sticker">
          </div>
          <div id="noMessage" aria-hidden="true" class="no-message" role="status"></div>
        </div>
      </div>
      <div class="inside">
            <div class="Text">
                <p>I'll be a good boy this time :)</p>
            </div>
        <div class="main-sticker">
            <img src="image/main-stk.webp" alt="Main sticker">
        </div>
        <div class = "buttons">
          <button class="btn" id="yesButton">Yes</button>
          <button class="btn" id="noButton">No</button>
        </div>
      </div>
    </div>

    <footer class="footer"></footer>

    <script>
      // wire up buttons
      const yes = document.getElementById('yesButton');
      const no = document.getElementById('noButton');
      const phone = '9176189467';

      function handleYesClick(e) {
        if (e && e.preventDefault) e.preventDefault();
        const message = 'Polam da lavadu';
        const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(message);
        window.open(url, '_blank');
      }

      yes.addEventListener('click', handleYesClick);
      yes.addEventListener('touchstart', handleYesClick);

      // dynamic floating hearts (generate inside .floating-hearts)
      const heartsContainer = document.querySelector('.floating-hearts');
      function createHeart(opts = {}){
        if(!heartsContainer) return;
        const el = document.createElement('span');
        el.textContent = '❤';
        const left = (opts.left !== undefined) ? opts.left : (Math.random() * 90);
        el.style.left = left + '%';
        el.style.fontSize = (opts.size || (12 + Math.random() * 18)) + 'px';
        el.style.color = opts.color || 'rgba(255,107,156,0.9)';
        el.style.opacity = (opts.opacity !== undefined) ? opts.opacity : 0.9;
        const dur = opts.duration || (8 + Math.random() * 6);
        el.style.animationDuration = dur + 's';
        if (opts.delay) el.style.animationDelay = opts.delay + 's';
        heartsContainer.appendChild(el);
        setTimeout(()=>{ el.remove(); }, (dur + (opts.delay||0)) * 1000 + 400);
      }

      function spawnInitialHearts(n = 8){ for(let i=0;i<n;i++){ createHeart({left: Math.random()*90, size: 12+Math.random()*18, duration:8+Math.random()*6, delay: Math.random()*6}); }}
      spawnInitialHearts(8);

      function spawnBurstAtClientX(clientX, count = 6){ const leftPercent = (clientX / window.innerWidth) * 100; for(let i=0;i<count;i++){ createHeart({left: Math.min(96, Math.max(2, leftPercent + (Math.random()*16-8))), size: 14+Math.random()*12, duration:6+Math.random()*3, delay: Math.random()*0.3}); }}

      // custom No behavior: show playful animated messages instead of navigating away
      const noMessages = [
        'say yes please 🥺',
        'dont i deserve a second chance? 💔',
        "I'll bring your favorite treats! 🍰✨",
        "are you really gona say No for this ? 😤"
      ];

      const noMessageEl = document.getElementById('noMessage');
      let noClicks = 0;
      function showNoMessage(text){
        noMessageEl.textContent = text;
        noMessageEl.classList.remove('pop');
        // force reflow to restart animation
        void noMessageEl.offsetWidth;
        noMessageEl.classList.add('pop');
        noMessageEl.setAttribute('aria-hidden','false');
      }

      function handleNoClick(e){
        e.preventDefault();
        const msgText = noMessages[noClicks % noMessages.length];
        showNoMessage(msgText);
        noClicks += 1;

        // trigger jump animation on Yes button
        yes.classList.remove('jump');
        void yes.offsetWidth;
        yes.classList.add('jump');

        // spawn a small burst of hearts near the click/tap location
        try{ const cx = (e && e.clientX) ? e.clientX : (no.getBoundingClientRect().left + no.offsetWidth/2); spawnBurstAtClientX(cx, 6); }catch(err){}
      }
      no.addEventListener('click', handleNoClick);
      no.addEventListener('touchstart', handleNoClick);
    </script>
  </body>
</html>
